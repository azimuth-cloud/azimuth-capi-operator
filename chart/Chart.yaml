---
apiVersion: v2
name: azimuth-capi-operator
description: Helm chart for deploying the Azimuth CAPI operator.
type: application
# The version and appVersion are updated by the chart build script
version: 0.1.0
appVersion: main
maintainers:
  - name: azimuth-cloud
    url: https://github.com/azimuth-cloud
home: https://github.com/azimuth-cloud/azimuth-capi-operator

dependencies:
  # stakater/reloader to reload when certificates change
  - name: reloader
    repository: https://stakater.github.io/stakater-charts
    version: 2.2.12
    condition: reloader.enabled
