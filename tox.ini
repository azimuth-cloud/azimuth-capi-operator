[tox]
minversion = 4.0.0
requires =
    tox>=4.58
    tox-uv>=1.36
# TODO: fix mypy, and add it to envlist
envlist = lint,3.12,coverage
skipsdist = True

[testenv]
runner = uv-venv-lock-runner
setenv =
    PYTHONWARNINGS=default::DeprecationWarning
    COVERAGE_FILE={tox_root}/.coverage.{env_name}
commands = pytest --cov=azimuth_capi_operator --cov-report= {posargs}

[testenv:lint]
description = Run ruff and codespell
commands =
    ruff check {tox_root}
    ruff format {tox_root} --check
    codespell {tox_root}

[testenv:autofix]
description = Apply ruff and codespell fixes
commands =
    ruff format {tox_root}
    codespell {tox_root} -w
    ruff check {tox_root} --fix

# Combine the coverage from all the test envs into one report
[testenv:coverage]
depends = 3.*
setenv =
    COVERAGE_FILE={tox_root}/.coverage
commands =
    coverage combine
    coverage report
    coverage xml -o {tox_root}/coverage.xml
    # Mark uncovered lines on the PR's diff
    diff-cover {tox_root}/coverage.xml --compare-branch {env:DIFF_COVER_COMPARE_BRANCH:origin/main} --format markdown:{tox_root}/diff-cover.md,github-annotations:warning

[testenv:mypy]
commands = mypy {tox_root} {posargs}
