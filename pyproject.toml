[project]
name = "azimuth-capi-operator"
dynamic = ["version"]
requires-python = ">=3.12"
description = "Kubernetes operator for opinionated Cluster API clusters"  
authors = [
	{name = "Matt Pryor"}
]
readme = "README.md"
license = "Apache-2.0"

dependencies = [
    "aiohttp>=3.14.5",
    "configomatic>=0.4.0",
    "cryptography>=50.0.2",
    "easykube>=0.6.0",
    "easysemver>=0.2.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "kopf>=1.45.2",
    "kube-custom-resource>=0.7.2",
    "pydantic>=2.14.1",
    "pyhelm3>=0.5.8"
]

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "coverage>=7.17.0",
    "diff-cover>=11.0.0",
    "mypy>=2.4.0",
    "ruff>=0.17.2",
    "stestr>=4.2.1",
    "tox>=4.67.4",
    "tox-uv>=1.37.2",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.1+unknown"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.format]
line-ending = "lf"

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # flake8-builtins
    "A",
    # Ruff rules
    "RUF",
    # flake8-async
    "ASYNC",
    # pyupgrade
    "UP",
    # tidy imports
    "TID",
    # sorted imports
    "I",
    # check complexity
    "C90",
    # pep8 naming
    "N",
]
ignore = [
]

[tool.mypy]
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.ruff.lint.mccabe]
# Flag errors (`C901`) whenever the complexity level exceeds 5.
max-complexity = 14
